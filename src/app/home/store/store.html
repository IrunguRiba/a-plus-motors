<div id="smooth-wrapper" #smoothWrapper>
    <div id="smooth-content" #smoothContent>
  
      <section class="store-container">
  
        <div class="main-nav-wrapper">
          <div class="nav-top">
            <div class="nav-brand">OUR STORE</div>
        
            <div class="nav-home" (click)="goHome()">HOME</div>
          </div>
          
  
          <div class="nav-filters">
            <div class="filter-item center"
                 [class.active]="activeView === 'all'"
                 (click)="setActiveView('all', $event)">ALL</div>
  
            <div class="filter-item center"
                 [class.active]="activeView === 'favorites'"
                 (click)="setActiveView('favorites', $event)">FAVORITES</div>
  
            <!-- FILTER BY BRAND (trigger only) -->
            <div class="filter-item dropdown"
                 [class.active]="activeFilterDropdown === 'brand'"
                 (click)="toggleFilterDropdown('brand', $event)">
              <span class="filter-label">
                FILTER BY &nbsp; {{ selectedBrandFilter || 'BRAND' }}
              </span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg"
                   [class.rotated]="activeFilterDropdown === 'brand'">
                <path d="M1 1L5 5L9 1" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
  
            <!-- FILTER BY YEAR (trigger only) -->
            <div class="filter-item dropdown"
                 [class.active]="activeFilterDropdown === 'year'"
                 (click)="toggleFilterDropdown('year', $event)">
              <span class="filter-label">
                FILTER BY &nbsp; {{ selectedYearFilter || 'YEAR' }}
              </span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg"
                   [class.rotated]="activeFilterDropdown === 'year'">
                <path d="M1 1L5 5L9 1" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="filter-dropdown-portal" *ngIf="activeFilterDropdown === 'brand'"
             (click)="$event.stopPropagation()">
          <div class="filter-dropdown-list">
            <div class="filter-dropdown-item"
                 *ngFor="let b of brands"
                 [class.selected]="b === selectedBrandFilter"
                 (click)="selectFilterOption('brand', b, $event)">
              {{ b }}
            </div>
          </div>
        </div>
  
        <div class="filter-dropdown-portal portal-year" *ngIf="activeFilterDropdown === 'year'"
             (click)="$event.stopPropagation()">
          <div class="filter-dropdown-list">
            <div class="filter-dropdown-item"
                 *ngFor="let y of years"
                 [class.selected]="y === selectedYearFilter"
                 (click)="selectFilterOption('year', y, $event)">
              {{ y }}
            </div>
          </div>
        </div>
  
        <!-- Main Store Content -->
        <div class="store">
          <div class="cars">
            <div class="car-card" *ngFor="let car of cars">
              <div class="car-image-wrapper">
                <img [src]="car.image" [alt]="car.brand">
              </div>
              <div class="car-details">
                <span class="car-year">{{ car.year }}</span>
                <span class="car-brand">{{ car.brand }}</span>
                <span class="car-price">{{ car.price }}</span>
              </div>
              <div class="car-actions">
                <button class="action-btn">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                  </svg>
                  <span>Like</span>
                </button>
                <button class="action-btn">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                  </svg>
                  <span>Bookmark</span>
                </button>
                <button class="action-btn">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                  </svg>
                  <span>Share</span>
                </button>
                <button class="inquire-box-btn" (click)="goToSpecs()">INQUIRE</button>
              </div>
            </div>
          </div>
  
          <div class="page">
            <div class="page-info">Page 1 / 3</div>
            <div class="page-next">Next</div>
          </div>
        </div>
  
        <div class="footer-wrapper">
          <a  class="footer-link" (click)="goToTradein()">
            Import
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>
          <a  class="footer-link" (click)="goToTradein()">
            Trade In
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>
          <a class="footer-link">
            Financing
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>
        </div>
  
      </section>
  
    </div>
  </div>
  
  <app-nav-2></app-nav-2>
