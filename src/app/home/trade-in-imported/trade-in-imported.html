<app-nav
  [searchWindowOpened]="searchWindowOpened"
  [isMenuOpen]="isMenuOpen"
  [logoImg]="logoImg"
  (openSearchEvent)="openSearch()"
  (closeSearchEvent)="closeSearch($event)"
  (toggleMenuEvent)="toggleMenu()">
</app-nav>

<div class="trade-in-imported-container">
  <nav class="tabs-wrapper" [class.is-visible]="tabsVisible">
    <div class="tabs">
      @for (t of tabs; track t.key) {
        <a class="tab" routerLink="/imported-trade-in" [queryParams]="{ tab: t.key }" [class.active]="active() === t.key"><sup>{{ t.n }}</sup><span>{{ t.label }}</span></a>
      }
    </div>
  </nav>

  <main class="content">
    @if (active() === 'import') {
      <app-imported />
    } @else {
      <app-trade-in />
    }
  </main>
</div>
