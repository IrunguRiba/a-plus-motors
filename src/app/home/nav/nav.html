<div class="nav-container">
  <div class="nav-items-wrapper" [class.nav-lifted]="isMenuOpen || scrolled">

    <div class="search-box"
         (click)="openSearch()"
         [class.is-open]="searchWindowOpened"
         [class.above-search]="searchWindowOpened">
      <span class="material-symbols-outlined">search</span>
      <span class="search-tag">Describe it! We got it!</span>
    </div>

    <p class="item-1-label" [class.above-search]="searchWindowOpened">A-PLUS MOTORS LTD</p>

    <div class="logo-wrapper" (click)="goHome()" [class.above-search]="searchWindowOpened">
      <img [src]="logoImg" alt="A plus Motors" class="image-icon">
      <span class="slogan" [class.above-search]="searchWindowOpened">Driving That Suits You ...</span>
    </div>

    <div class="side-bar item item-3">
      <div class="sidebar-top">
        <div class="menu-bar"
             (click)="toggleMenu()"
             [class.is-open]="isMenuOpen"
             [class.above-search]="searchWindowOpened">
          <span class="top-bar"></span>
          <span class="bottom-bar"></span>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="chat-icon"
             (click)="toggleChat()"
             [class.is-open]="isChatOpen"
             [class.above-search]="searchWindowOpened">
          <svg class="chat-svg bubble-icon" viewBox="0 0 24 24" width="24" height="24"
               stroke="currentColor" stroke-width="1.5" fill="none"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <path d="M13 8H7"></path>
            <path d="M17 12H7"></path>
          </svg>
          <svg class="chat-svg cancel-icon" viewBox="0 0 24 24" width="24" height="24"
               stroke="currentColor" stroke-width="1.5" fill="none"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-overlay" [class.is-open]="isMenuOpen">
    <div class="menu-opened" [class.search-active]="searchWindowOpened">

      <nav class="menu-nav" aria-label="Main navigation">
        <ul class="menu-list">

          <li class="has-submenu"
              *ngFor="let item of menu; trackBy: trackByKey"
              [class.active]="activeSubmenu === item.key">

            <a role="button" tabindex="0"
               (click)="toggleSubmenu(item.key, $event)"
               (keydown.enter)="toggleSubmenu(item.key, $event)"
               [attr.aria-expanded]="activeSubmenu === item.key">
              <span class="nav-label">{{ item.label }}</span>
            </a>

            <div class="submenu-panel" *ngIf="activeSubmenu === item.key">

              <div class="submenu-main">
                <span class="submenu-label">{{ item.title }}</span>
                <ul class="submenu-links">
                  <li *ngFor="let link of item.links">
                    <a tabindex="0" (click)="go(link)" (keydown.enter)="go(link)">{{ link.label }}</a>
                  </li>
                </ul>
                <div class="submenu-extras">
                  <ng-container *ngTemplateOutlet="extras"></ng-container>
                </div>
              </div>

              <div class="submenu-aside">
                <div class="submenu-feature" role="link" tabindex="0"
                     (click)="go(item.feature)" (keydown.enter)="go(item.feature)">
                  <img [src]="item.feature.image" [alt]="item.feature.title">
                  <div class="feature-text">
                    <span class="feature-title" [class.is-long]="item.feature.long">{{ item.feature.title }}</span>
                    <span class="feature-sub">{{ item.feature.text }}</span>
                    <span class="feature-more">Read more</span>
                  </div>
                </div>
                <div class="feature-socials">
                  <div class="social-icons">
                    <a href="#" aria-label="Phone"><img [src]="phone" alt="Phone"></a>
                    <a href="#" aria-label="Instagram"><img [src]="ig" alt="Instagram"></a>
                    <a href="#" aria-label="Facebook"><img [src]="facebook" alt="Facebook"></a>
                    <a href="#" aria-label="X"><img [src]="twitter" alt="X"></a>
                    <a href="#" aria-label="WhatsApp"><img [src]="whatsapp" alt="WhatsApp"></a>
                    <a href="#" aria-label="Email"><img [src]="email" alt="Email"></a>
                    <a href="#" aria-label="YouTube"><img [src]="youtube" alt="YouTube"></a>
                  </div>
                </div>
              </div>

            </div>
          </li>

        </ul>
      </nav>

    </div>
  </div>

  <div class="search-overlay" [class.is-open]="searchWindowOpened">
    <div class="close-search-btn" (click)="closeSearch($event)">
      <span>Close Search</span>
      <div class="cross-icon">
        <span></span>
        <span></span>
      </div>
    </div>
    <app-search class="search-panel"></app-search>
  </div>

</div>

<ng-template #extras>
  <div class="extra-link" (click)="gototContacts()"><span>Contact</span><span class="material-symbols-outlined">mail</span></div>
  <div class="extra-link"><span>Login</span><span class="material-symbols-outlined">person</span></div>
</ng-template>
