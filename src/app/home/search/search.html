<div class="search-overlay">

    <!-- Center Search Bar -->
    <div class="search-container">
      <div class="input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()" 
          placeholder="Search Anything. . ." 
          aria-label="Search Anything"
        />
  
        <!-- Voice Search Button (Mic) -->
        <button 
          type="button" 
          class="mic-btn" 
          [class.listening]="isListening" 
          (click)="toggleVoiceSearch()" 
          [title]="isListening ? 'Listening...' : 'Click to speak'"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>
    </div>
  
    <!-- Category Quick Links with Arrow Animations -->
    <div class="categories">
      <a href="#sale" class="category-link">
        <span>Sale</span>
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="21" x2="20" y2="4"></line>
          <polyline points="9 4 20 4 20 15"></polyline>
        </svg>
      </a>
    
      <a href="#brand-new" class="category-link">
        <span>Brand New</span>
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="21" x2="20" y2="4"></line>
          <polyline points="9 4 20 4 20 15"></polyline>
        </svg>
      </a>
    
      <a href="#pre-owned" class="category-link">
        <span>Pre-Owned</span>
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="21" x2="20" y2="4"></line>
          <polyline points="9 4 20 4 20 15"></polyline>
        </svg>
      </a>
    </div>
  </div>
